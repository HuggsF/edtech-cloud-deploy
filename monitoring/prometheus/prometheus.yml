global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'edtech-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'api'
          environment: 'local'

  # Workers are scaled horizontally (`deploy.replicas` / `--scale worker=N`). Docker's embedded DNS
  # returns one A record per replica, so DNS service discovery scrapes EVERY worker — a static
  # `worker:9464` target would hit a different replica on each scrape.
  - job_name: 'edtech-worker'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9464
        refresh_interval: 5s
    relabel_configs:
      - target_label: service
        replacement: 'worker'
      - target_label: environment
        replacement: 'local'
