global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'edtech-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'api'
          environment: 'local'

  - job_name: 'edtech-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:9464']
        labels:
          service: 'worker'
          environment: 'local'
