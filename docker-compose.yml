services:
  mysql:
    image: mysql:8.0
    container_name: edtech-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edtech
      MYSQL_USER: edtech
      MYSQL_PASSWORD: edtech_secret
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: edtech-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: edtech-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:latest
    container_name: edtech-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  api:
    build:
      context: .
      target: production
    container_name: edtech-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_ROLE: api
      PORT: 3000
      METRICS_PORT: 9464
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: edtech
      DB_PASSWORD: edtech_secret
      DB_NAME: edtech
      DB_MIGRATE_ON_START: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      LOG_LEVEL: info
      LOG_PRETTY: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ROLE: worker
      METRICS_PORT: 9464
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: edtech
      DB_PASSWORD: edtech_secret
      DB_NAME: edtech
      DB_MIGRATE_ON_START: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_PREFETCH: 10
      LOG_LEVEL: info
      LOG_PRETTY: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
