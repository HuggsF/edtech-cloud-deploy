name: Continuous Deployment (ECS)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute Image Tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/edtech-cloud-deploy:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/edtech-cloud-deploy:latest

  deploy:
    name: Run Migrations & Deploy to ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Run Database Migrations as One-Off Task
        run: |
          aws ecs run-task \
            --cluster edtech-cluster-prod \
            --task-definition edtech-api-prod \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_ID }}],securityGroups=[${{ secrets.SG_ID }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides": [{"name": "api", "command": ["node", "dist/migrate.js"]}]}'

      - name: Update ECS Services
        run: |
          aws ecs update-service --cluster edtech-cluster-prod --service edtech-api-prod --force-new-deployment
          aws ecs update-service --cluster edtech-cluster-prod --service edtech-worker-prod --force-new-deployment

      - name: Wait for Services Stabilization
        run: |
          aws ecs wait services-stable --cluster edtech-cluster-prod --services edtech-api-prod edtech-worker-prod
